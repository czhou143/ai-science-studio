<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="tokens.css">
  <style>
    html, body { background: var(--navy); }
    body { font-family: var(--sans); font-weight: 500; }
    .serif { font-family: var(--serif); }

    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 156px;
      padding: 46px 80px 0;
      z-index: 5;
      box-sizing: border-box;
    }
    header:after {
      content: "";
      position: absolute;
      left: 80px; right: 80px; bottom: 0;
      height: 2px;
      background: rgba(247, 244, 236, 0.16);
    }
    .brand {
      margin: 0;
      font-size: 26px;
      line-height: 1;
      letter-spacing: 0.2em;
      color: rgba(247, 244, 236, 0.86);
    }
    .brand i {
      display: inline-block;
      width: 14px; height: 14px;
      margin-right: 14px;
      background: var(--orange);
      vertical-align: -1px;
    }
    .ticks { display: flex; gap: 10px; margin-top: 26px; height: 8px; }
    .tick { flex: 1; background: rgba(247, 244, 236, 0.14); position: relative; overflow: hidden; }
    .tick b {
      position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
      background: var(--orange);
      transform: scaleX(0);
      transform-origin: left center;
    }

    #stage {
      position: absolute;
      top: 180px; left: 80px; right: 80px; bottom: 318px;
      z-index: 2;
      overflow: hidden;
    }
    #fx {
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 18px;
      background: var(--orange);
      z-index: 8;
      opacity: 0;
      pointer-events: none;
    }
    #stage svg * { transform-box: fill-box; }
    .scene { position: absolute; inset: 0; opacity: 0; }

    .subwrap {
      position: absolute;
      left: 96px; right: 96px; bottom: 78px;
      height: 190px;
      z-index: 6;
      text-align: center;
    }
    .submark {
      width: 48px; height: 6px;
      margin: 0 auto 18px;
      background: var(--orange);
    }
    #sub {
      margin: 0;
      font-size: 44px;
      line-height: 1.35;
      font-weight: 500;
      color: var(--paper);
    }

    .opener, .split, .bars, .race, .sparse, .lines, .end { height: 100%; }
    .opener { display: flex; flex-direction: column; }
    .opener h1 {
      margin: 8px 0 0;
      font-family: var(--serif);
      font-size: 84px;
      font-weight: 700;
      line-height: 1.16;
      letter-spacing: 0.01em;
    }
    .opener .deck {
      margin: 26px 0 0;
      font-size: 36px;
      line-height: 1.4;
      color: rgba(247, 244, 236, 0.72);
    }
    .opener .art { flex: 1; min-height: 0; margin-top: 8px; }
    .opener svg, .bars svg, .race svg { width: 100%; height: 100%; display: block; }

    .split { display: flex; flex-direction: column; justify-content: center; }
    .split-row { display: flex; gap: 32px; align-items: stretch; }
    .card {
      flex: 1;
      box-sizing: border-box;
      border: 2px solid rgba(247, 244, 236, 0.28);
      border-top: 8px solid rgba(247, 244, 236, 0.82);
      background: rgba(247, 244, 236, 0.035);
      min-height: 760px;
      padding: 56px 28px 44px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .card.measured { border-top-color: var(--blue); }
    .badge {
      margin: 0;
      padding: 8px 18px 7px;
      font-size: 26px;
      letter-spacing: 0.16em;
      border: 2px solid rgba(247, 244, 236, 0.75);
      color: var(--paper);
    }
    .badge.measured { background: var(--blue); border-color: var(--blue); }
    .badge.projected { color: var(--orange); border-color: var(--orange); }
    .card .year {
      margin: 40px 0 0;
      font-family: var(--serif);
      font-size: 40px;
      color: rgba(247, 244, 236, 0.78);
    }
    .card .num {
      margin-top: 18px;
      font-family: var(--serif);
      font-size: 148px;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.04em;
    }
    .card .unit {
      margin-top: 18px;
      font-size: 32px;
      letter-spacing: 0.12em;
      color: rgba(247, 244, 236, 0.75);
    }
    .card .label { margin: auto 0 0; font-size: 32px; }
    .card .src { margin: 14px 0 0; font-size: 24px; color: rgba(247, 244, 236, 0.5); }
    .stamp-line {
      margin: 36px 0 0;
      text-align: center;
      font-family: var(--serif);
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--orange);
    }
    .footnote {
      margin: 22px 0 0;
      text-align: center;
      font-size: 32px;
      color: rgba(247, 244, 236, 0.78);
    }

    .bars { display: flex; flex-direction: column; }
    .bars .chart-title {
      margin: 8px 0 0;
      text-align: center;
      font-family: var(--serif);
      font-size: 40px;
      font-weight: 700;
    }
    .bars .chart { flex: 1; min-height: 0; }
    .bars .note, .sparse .note {
      margin: 10px 0 0;
      text-align: center;
      font-size: 32px;
      line-height: 1.4;
      color: rgba(247, 244, 236, 0.82);
    }
    .bars .src, .sparse .src {
      margin: 12px 0 18px;
      text-align: center;
      font-size: 24px;
      color: rgba(247, 244, 236, 0.5);
    }
    .bars svg text { font-family: var(--serif); fill: var(--paper); }
    .bars svg text.sans { font-family: var(--sans); }
    .bars svg text.dim { fill: rgba(247, 244, 236, 0.72); }
    .bars svg text.accent { fill: var(--orange); }

    .race {
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 132px 1fr;
      grid-template-rows: auto 1fr auto;
      column-gap: 8px;
    }
    .race h2 {
      margin: 4px 0 8px;
      font-family: var(--serif);
      font-size: 48px;
      font-weight: 700;
      text-align: center;
    }
    .race .art { min-height: 0; }
    .race .tag {
      margin: 12px 0 0;
      text-align: center;
      font-size: 28px;
      line-height: 1.35;
      color: rgba(247, 244, 236, 0.78);
    }
    .race .mid {
      grid-column: 2;
      grid-row: 1 / span 3;
      align-self: center;
      margin: 0;
      text-align: center;
      font-family: var(--serif);
      font-size: 42px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.12em;
      color: var(--orange);
      white-space: pre-line;
    }
    .race .lt, .race .la, .race .lg { grid-column: 1; }
    .race .rt, .race .ra, .race .rg { grid-column: 3; }
    .race .lt, .race .rt { grid-row: 1; }
    .race .la, .race .ra { grid-row: 2; }
    .race .lg, .race .rg { grid-row: 3; }

    .sparse { display: flex; flex-direction: column; justify-content: center; }
    .pair { display: flex; }
    .pair .col { flex: 1; }
    .pair .col.right { text-align: right; }
    .pair .num {
      font-family: var(--serif);
      font-size: 108px;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.04em;
    }
    .pair .col.right .num { color: var(--orange); }
    .pair .unit {
      margin-left: 10px;
      font-size: 32px;
      letter-spacing: 0.08em;
      color: rgba(247, 244, 236, 0.72);
    }
    .pair .label {
      margin: 14px 0 0;
      font-size: 30px;
      color: rgba(247, 244, 236, 0.78);
    }
    .gridwrap { margin-top: 48px; }
    .gridwrap svg { width: 100%; height: auto; display: block; }
    .sparse .note {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      margin-top: 28px;
      text-align: left;
    }
    .sparse .note i {
      width: 18px; height: 18px;
      background: var(--orange);
      flex: none;
    }

    .lines { display: flex; flex-direction: column; justify-content: center; }
    .lines h2 {
      margin: 0 0 56px;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: rgba(247, 244, 236, 0.66);
    }
    .lines ul { list-style: none; margin: 0; padding: 0; }
    .lines li {
      display: flex;
      gap: 28px;
      align-items: center;
      margin: 0 0 52px;
      font-family: var(--serif);
      font-size: 58px;
      font-weight: 700;
      line-height: 1.25;
    }
    .lines li:last-child { margin-bottom: 0; }
    .lines li i {
      width: 18px; height: 18px;
      background: var(--orange);
      flex: none;
    }

    .end {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .end .kicker {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.24em;
      color: rgba(247, 244, 236, 0.62);
    }
    .end .rule { width: 56px; height: 6px; margin: 32px 0; background: var(--orange); }
    .end .disclosure {
      margin: 0;
      max-width: 860px;
      font-family: var(--serif);
      font-size: 52px;
      font-weight: 700;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <header>
    <p class="brand"><i></i>AI 科普工作室</p>
    <div class="ticks" id="ticks"></div>
  </header>
  <div id="stage"><div id="fx"></div></div>
  <div class="subwrap">
    <div class="submark" id="submark"></div>
    <p id="sub"></p>
  </div>
  <script>
    window.__film = __FILM__;
    var SVGNS = "http://www.w3.org/2000/svg";
    var PAPER = "#F7F4EC";
    var ORANGE = "#B5452F";
    var BLUE = "#1F6E8C";
    var NAVY = "#1B2A41";

    function clamp01(x) { return Math.max(0, Math.min(1, x)); }
    function ease(x) { x = clamp01(x); return 1 - Math.pow(1 - x, 3); }
    function seg(t, a, b) { return ease((t - a) / (b - a)); }
    function S(tag, attrs) {
      var n = document.createElementNS(SVGNS, tag);
      attrs = attrs || {};
      Object.keys(attrs).forEach(function (k) {
        if (attrs[k] === undefined || attrs[k] === null) return;
        n.setAttribute(k, String(attrs[k]));
      });
      return n;
    }
    function cueStart(cues, key, fallback) {
      if (!cues || !key) return fallback;
      for (var i = 0; i < cues.length; i++) {
        if (cues[i].text.indexOf(key) >= 0) return cues[i].start;
      }
      return fallback;
    }
    function cueText(cues, t) {
      if (!cues || !cues.length) return "";
      var last = "";
      for (var i = 0; i < cues.length; i++) {
        if (t + 1e-4 >= cues[i].start) last = cues[i].text;
        if (t >= cues[i].start && t < cues[i].end) return cues[i].text;
      }
      return last;
    }
    function prepDraw(path) {
      var len = path.getTotalLength();
      path._len = len;
      path.setAttribute("stroke-dasharray", String(len));
      path.setAttribute("stroke-dashoffset", String(len));
    }
    function drawTo(path, p) {
      var len = path._len || 0;
      path.setAttribute("stroke-dashoffset", String(len * (1 - clamp01(p))));
    }
    function stackFour(text) {
      if (!text || text.length !== 4) return text || "";
      return text.slice(0, 2) + "\n" + text.slice(2);
    }

    function makeSvg(viewBox) {
      return S("svg", { viewBox: viewBox, preserveAspectRatio: "xMidYMid meet" });
    }

    function addRack(parent, w, h) {
      var g = S("g");
      g.appendChild(S("rect", {
        x: 0, y: 0, width: w, height: h,
        fill: "rgba(247,244,236,0.05)", stroke: PAPER, "stroke-width": 3
      }));
      g.appendChild(S("rect", {
        x: 0, y: 0, width: w, height: 22, fill: "rgba(247,244,236,0.1)"
      }));
      var leds = [];
      var ly = 46;
      for (var i = 0; i < 7; i++) {
        g.appendChild(S("rect", {
          x: (w - 16) / 2, y: ly, width: 16, height: 10,
          fill: "rgba(247,244,236,0.16)"
        }));
        var on = S("rect", {
          x: (w - 16) / 2, y: ly, width: 16, height: 10,
          fill: ORANGE, opacity: 0
        });
        g.appendChild(on);
        leds.push(on);
        ly += 34;
      }
      parent.appendChild(g);
      return { g: g, leds: leds };
    }

    function towerD(x, base, w, h) {
      var ax = x + w / 2;
      var top = base - h;
      return [
        "M " + x + " " + base + " L " + ax + " " + top,
        "M " + (x + w) + " " + base + " L " + ax + " " + top,
        "M " + (x + w * 0.22) + " " + (base - h * 0.36) + " L " + (x + w * 0.78) + " " + (base - h * 0.36),
        "M " + (x + w * 0.32) + " " + (base - h * 0.64) + " L " + (x + w * 0.68) + " " + (base - h * 0.64),
        "M " + (ax - w * 0.42) + " " + top + " L " + (ax + w * 0.42) + " " + top
      ].join(" ");
    }

    function addTower(parent, x, base, w, h) {
      var path = S("path", {
        d: towerD(x, base, w, h),
        fill: "none", stroke: PAPER, "stroke-width": 3,
        "stroke-linecap": "round", "stroke-linejoin": "round"
      });
      parent.appendChild(path);
      return path;
    }

    function addStation(parent, x, y, w, h, dashed) {
      var g = S("g");
      g.appendChild(S("rect", {
        x: x, y: y, width: w, height: h,
        fill: dashed ? "none" : "rgba(247,244,236,0.04)",
        stroke: PAPER, "stroke-width": 3,
        "stroke-dasharray": dashed ? "7 8" : "none",
        opacity: dashed ? 0.55 : 1
      }));
      [0.35, 0.65].forEach(function (p) {
        g.appendChild(S("circle", {
          cx: x + w * p, cy: y, r: 8,
          fill: NAVY, stroke: PAPER, "stroke-width": 3,
          opacity: dashed ? 0.55 : 1
        }));
      });
      parent.appendChild(g);
      return g;
    }

    function buildOpener(root, scene) {
      var title = document.createElement("h1");
      var parts = (scene.title || "").split("，");
      if (parts.length > 1) {
        title.appendChild(document.createTextNode(parts[0]));
        title.appendChild(document.createElement("br"));
        title.appendChild(document.createTextNode(parts.slice(1).join("，")));
      } else {
        title.textContent = scene.title || "";
      }
      var deck = document.createElement("p");
      deck.className = "deck";
      deck.textContent = scene.deck || "";
      var art = document.createElement("div");
      art.className = "art";
      var svg = makeSvg("0 0 920 1000");
      art.appendChild(svg);
      root.appendChild(title);
      root.appendChild(deck);
      root.appendChild(art);

      var wire = S("path", {
        d: "M 127 170 Q 400 36 721 468 M 287 180 Q 540 150 766 468",
        fill: "none", stroke: PAPER, "stroke-width": 3, "stroke-linecap": "round"
      });
      svg.appendChild(wire);
      var towerA = addTower(svg, 90, 430, 74, 260);
      var towerB = addTower(svg, 250, 460, 74, 280);
      var station = addStation(svg, 668, 468, 150, 112, false);
      var power = S("path", {
        d: "M 743 580 L 743 628 L 168 628",
        fill: "none", stroke: ORANGE, "stroke-width": 12, "stroke-linecap": "square", "stroke-linejoin": "miter"
      });
      svg.appendChild(power);

      var cluster = S("g");
      svg.appendChild(cluster);
      var racks = [];
      var drops = [];
      var x0 = 168, rw = 96, gap = 22, rh = 292, base = 948;
      for (var i = 0; i < 5; i++) {
        var rack = addRack(cluster, rw, rh);
        var x = x0 + i * (rw + gap);
        rack.g.setAttribute("transform", "translate(" + x + " " + (base - rh) + ")");
        rack.x = x;
        racks.push(rack);
        var drop = S("rect", {
          x: x + rw / 2 - 3, y: 628, width: 6, height: base - rh - 628,
          fill: ORANGE, opacity: 0
        });
        svg.appendChild(drop);
        drops.push(drop);
      }
      var ground = S("line", {
        x1: 140, y1: 956, x2: 820, y2: 956,
        stroke: PAPER, "stroke-width": 2, opacity: 0.35
      });
      svg.appendChild(ground);

      root._title = title;
      root._deck = deck;
      root._wire = wire;
      root._towers = [towerA, towerB];
      root._power = power;
      root._racks = racks;
      root._drops = drops;
      root._station = station;
      root._rackCluster = cluster;
      root._extras = [wire, towerA, towerB, ground].concat(drops);
    }

    function updateOpener(root, t) {
      root._title.style.opacity = "1";
      root._deck.style.opacity = String(seg(t, 0.05, 0.35));
      [root._wire].concat(root._towers).forEach(function (path) {
        if (!path._len) prepDraw(path);
      });
      var draw = seg(t, 0.12, 0.85);
      drawTo(root._wire, draw);
      root._towers.forEach(function (path) { drawTo(path, draw); });
      root._station.style.opacity = String(seg(t, 0.2, 0.5));
      if (!root._power._len) prepDraw(root._power);
      drawTo(root._power, seg(t, 0.55, 1.25));
      root._racks.forEach(function (rack, i) {
        var p = seg(t, 0.08 + i * 0.05, 0.32 + i * 0.05);
        rack.g.style.opacity = String(p);
      });
      root._drops.forEach(function (drop, i) {
        drop.setAttribute("opacity", String(seg(t, 1.05 + i * 0.06, 1.28 + i * 0.06)));
      });
      var flat = [];
      root._racks.forEach(function (rack) {
        rack.leds.forEach(function (led) { flat.push(led); });
      });
      flat.forEach(function (led, i) {
        var p = seg(t, 1.2 + i * 0.028, 1.38 + i * 0.028);
        led.setAttribute("opacity", String(p));
      });
    }

    function buildSplit(root, scene) {
      var row = document.createElement("div");
      row.className = "split-row";
      row.appendChild(cardEl(scene.left, scene.leftLabel));
      row.appendChild(cardEl(scene.right, scene.rightLabel));
      var stamp = document.createElement("p");
      stamp.className = "stamp-line";
      stamp.textContent = scene.stamp || "";
      var note = document.createElement("p");
      note.className = "footnote";
      note.textContent = scene.footnote || "";
      root.appendChild(row);
      root.appendChild(stamp);
      root.appendChild(note);
      root._row = row;
      root._cards = [row.children[0], row.children[1]];
      root._stamp = stamp;
      root._note = note;
    }

    function cardEl(card, label) {
      var node = document.createElement("article");
      node.className = "card " + (card && card.kind ? card.kind : "");
      var badge = document.createElement("p");
      badge.className = "badge " + (card ? card.kind : "");
      badge.textContent = card ? card.kindLabel : "";
      var year = document.createElement("p");
      year.className = "year";
      year.textContent = card ? card.year : "";
      var num = document.createElement("div");
      num.className = "num";
      num.textContent = card ? card.value : "";
      var unit = document.createElement("div");
      unit.className = "unit";
      unit.textContent = card ? card.unit : "";
      var cap = document.createElement("p");
      cap.className = "label";
      cap.textContent = label || "";
      var src = document.createElement("p");
      src.className = "src";
      src.textContent = card && card.source ? "来源 " + card.source : "";
      [badge, year, num, unit, cap, src].forEach(function (el) { node.appendChild(el); });
      return node;
    }

    function updateSplit(root, t, dur, scene) {
      var p = root._present ? 1 : seg(t, 0.04, 0.36);
      root._row.style.opacity = String(p);
      root._row.style.transform = root._present ? "none" : ("translateY(" + ((1 - p) * 18) + "px)");
      var at = cueStart(scene.cues, scene.stamp, 0.7);
      var s = seg(t, at, at + 0.28);
      root._stamp.style.opacity = String(s);
      root._note.style.opacity = String(seg(t, at, at + 0.4));
    }

    function buildBars(root, scene) {
      var title = document.createElement("p");
      title.className = "chart-title";
      title.textContent = scene.leftLabel || "";
      var chart = document.createElement("div");
      chart.className = "chart";
      var svg = makeSvg("0 0 920 980");
      chart.appendChild(svg);
      var note = document.createElement("p");
      note.className = "note";
      note.textContent = scene.note || "";
      var src = document.createElement("p");
      src.className = "src";
      var source = scene.left && scene.left.source ? scene.left.source : "";
      src.textContent = source ? "来源 " + source : "";
      root.appendChild(title);
      root.appendChild(chart);
      root.appendChild(note);
      root.appendChild(src);

      var base = 760;
      var maxH = 500;
      var maxV = Math.max(scene.left.number, scene.right.number);
      var axis = S("line", {
        x1: 120, y1: base, x2: 800, y2: base,
        stroke: PAPER, "stroke-width": 2, opacity: 0.4
      });
      svg.appendChild(axis);
      function column(card, x, label, accent) {
        var g = S("g");
        var h = maxH * card.number / maxV;
        var bar = S("rect", {
          x: x - 84, y: base, width: 168, height: 0,
          fill: accent ? "rgba(181,69,47,0.46)" : BLUE,
          stroke: accent ? ORANGE : "none",
          "stroke-width": accent ? 3 : 0
        });
        var num = S("text", {
          x: x, y: base - h - 58, "text-anchor": "middle",
          "font-size": 76, "font-weight": 700
        });
        num.textContent = card.value;
        var unit = S("text", {
          x: x, y: base - h - 18, "text-anchor": "middle",
          "font-size": 28, class: "sans dim"
        });
        unit.textContent = card.unit;
        var year = S("text", {
          x: x, y: base + 58, "text-anchor": "middle",
          "font-size": 40, "font-weight": 700
        });
        year.textContent = card.year;
        var kind = S("text", {
          x: x, y: base + 108, "text-anchor": "middle",
          "font-size": 28, class: accent ? "sans accent" : "sans dim"
        });
        kind.textContent = label ? card.kindLabel + " · " + label : card.kindLabel;
        g.appendChild(bar);
        g.appendChild(num);
        g.appendChild(unit);

      }
      root._title = title;

    function grow(col, p, base) {

    function updateBars(root, t, dur, scene) {

    function buildRace(root, scene) {

      right.appendChild(live2);

    function buildSparse(root, scene) {

    function statCol(card, label, right) {

      col.appendChild(cap);

    }

    function updateSparse(root, t, dur, scene) {
      var p = root._present ? 1 : seg(t, 0.04, 0.32);
      root._pair.firstChild.style.opacity = String(p);
      var cellP = root._present ? 1 : seg(t, 0.12, 0.4);
      root._cells.forEach(function (cell) { cell.setAttribute("opacity", String(cellP)); });
      var at = Math.max(0.35, cueStart(scene.cues, scene.active.value, 0.8));
      var lp = seg(t, at, at + 0.45);
      root._activeCol.style.opacity = String(lp);
      root._lit.forEach(function (cell, i) {
        cell.setAttribute("opacity", String(seg(t, at + i * 0.03, at + 0.28 + i * 0.03)));
      });
      root._note.style.opacity = String(seg(t, at + 0.15, at + 0.5));
      root._src.style.opacity = String(p);
    }

    function buildLines(root, scene) {
      var h = document.createElement("h2");
      h.textContent = scene.title || "";
      var ul = document.createElement("ul");
      var items = [];
      (scene.lines || []).forEach(function (line) {
        var li = document.createElement("li");
        var mark = document.createElement("i");
        var span = document.createElement("span");
        span.textContent = line;
        li.appendChild(mark);
        li.appendChild(span);
        ul.appendChild(li);
        items.push(li);
      });
      root.appendChild(h);
      root.appendChild(ul);
      root._h = h;
      root._items = items;
    }

    function updateLines(root, t, dur, scene) {
      root._h.style.opacity = String(root._present ? 1 : seg(t, 0.02, 0.25));
      root._items.forEach(function (li, i) {
        var line = (scene.lines || [])[i] || "";
        var key = line.replace(/[，。！？、]/g, "").slice(0, 4);
        var at = cueStart(scene.cues, key, 0.35 + i * 0.7);
        var p = seg(t, at, at + 0.32);
        li.style.opacity = String(p);
        li.style.transform = "translateX(" + ((1 - p) * 78) + "px)";
      });
    }

    function buildEnd(root, scene) {
      var kicker = document.createElement("p");
      kicker.className = "kicker";
      kicker.textContent = scene.kicker || "";
      var rule = document.createElement("div");
      rule.className = "rule";
      var p = document.createElement("p");
      p.className = "disclosure";
      var parts = (scene.title || "").split(" · ");
      if (parts.length === 2) {
        p.appendChild(document.createTextNode(parts[0] + " ·"));
        p.appendChild(document.createElement("br"));
        p.appendChild(document.createTextNode(parts[1]));
      } else {

      }

      root.appendChild(rule);
      root.appendChild(p);
      root._block = [kicker, rule, p];
    }

    function updateEnd(root, t) {
      var p = root._present ? 1 : seg(t, 0.02, 0.32);
      root._block.forEach(function (el) { el.style.opacity = String(p); });
    }

    var builders = {
      opener: buildOpener,
      split: buildSplit,
      bars: buildBars,
      race: buildRace,
      sparse: buildSparse,
      lines: buildLines,
      end: buildEnd
    };
    var updaters = {
      opener: updateOpener,
      split: updateSplit,
      bars: updateBars,
      race: updateRace,
      sparse: updateSparse,
      lines: updateLines,
      end: updateEnd
    };

    var film = window.__film;
    var stage = document.getElementById("stage");
    var tickRow = document.getElementById("ticks");
    film.scenes.forEach(function (scene) {
      var tick = document.createElement("div");
      tick.className = "tick";
      var bar = document.createElement("b");
      tick.appendChild(bar);
      tickRow.appendChild(tick);
      scene._tick = bar;
      var root = document.createElement("section");
      root.className = "scene " + scene.template;
      builders[scene.template](root, scene);
      stage.appendChild(root);
      scene.root = root;
    });

    // Each join straddles the scene boundary: the tail of one shot and the
    // opening of the next. Shared pieces move, resize, or recolor. Nothing
    // here is a CSS transition — every frame is a function of t.
    // 0 morph, 1 morph, 2 zoom-through, 3 morph, 4 slide, 5 shape-wipe.
    var MORPH_OUT = 0.28;
    var MORPH_IN = 0.56;
    var gripped = [];

    function lerp(a, b, p) { return a + (b - a) * p; }
    function smooth(x) { x = clamp01(x); return x * x * (3 - 2 * x); }
    function easeIO(x) {
      x = clamp01(x);
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }
    function ramp(p, a, b) { return smooth((p - a) / (b - a)); }
    function grip(el) {
      if (!el || gripped.indexOf(el) >= 0) return;
      gripped.push(el);
    }
    function release() {
      for (var i = 0; i < gripped.length; i++) {
        var el = gripped[i];
        el.style.transform = "";
        el.style.opacity = "";
        el.style.clipPath = "";
        el.style.transformOrigin = "";
        el.style.borderTopColor = "";
        el.style.backgroundColor = "";
        el.style.borderColor = "";
      }
    }
    function boxOf(el) {
      if (!el) return null;
      if (el._box) return el._box;
      var s = stage.getBoundingClientRect();
      var r = el.getBoundingClientRect();
      el._box = {
        x: r.left - s.left,
        y: r.top - s.top,
        w: Math.max(1, r.width),
        h: Math.max(1, r.height),
        cx: r.left - s.left + r.width / 2,
        cy: r.top - s.top + r.height / 2
      };
      return el._box;
    }
    function morphTo(el, from, to, p, opacity) {
      if (!el || !from || !to) return;
      var rest = boxOf(el);
      var cx = lerp(from.cx, to.cx, p);
      var cy = lerp(from.cy, to.cy, p);
      var bw = Math.max(1, lerp(from.w, to.w, p));
      var bh = Math.max(1, lerp(from.h, to.h, p));
      var sc = Math.min(bw / rest.w, bh / rest.h);
      if (!isFinite(sc) || sc <= 0) sc = 1;
      el.style.transformOrigin = "center center";
      el.style.transform = "translate(" + (cx - rest.cx).toFixed(2) + "px," + (cy - rest.cy).toFixed(2) + "px) scale(" + sc.toFixed(4) + ")";
      el.style.opacity = String(clamp01(opacity));
      grip(el);
    }
    function fadeStyle(el, opacity) {
      if (!el) return;
      el.style.opacity = String(clamp01(opacity));
      grip(el);
    }
    function fadeChildren(el, opacity) {
      if (!el) return;
      for (var i = 0; i < el.children.length; i++) fadeStyle(el.children[i], opacity);
    }
    function mixHex(a, b, p) {
      function part(hex, i) { return parseInt(hex.slice(i, i + 2), 16); }
      function hex2(n) { var s = Math.round(n).toString(16); return s.length < 2 ? "0" + s : s; }
      var r = part(a, 1) + (part(b, 1) - part(a, 1)) * p;
      var g = part(a, 3) + (part(b, 3) - part(a, 3)) * p;
      var bl = part(a, 5) + (part(b, 5) - part(a, 5)) * p;
      return "#" + hex2(r) + hex2(g) + hex2(bl);
    }
    function paintPlate(el) {
      el.style.backgroundColor = NAVY;
      grip(el);
    }
    function measureAll() {
      if (measureAll.done) return;
      var bars = null;
      film.scenes.forEach(function (scene) {
        if (scene.template === "bars") bars = scene;
      });
      if (bars) {
        [bars.root._left, bars.root._right].forEach(function (col) {
          col.bar.setAttribute("y", String(bars.root._base - col.h));
          col.bar.setAttribute("height", String(col.h));
        });
      }
      stage.getBoundingClientRect();
      film.scenes.forEach(function (scene) {
        var root = scene.root;
        var els = [
          root._title, root._deck, root._rackCluster, root._station, root._power,
          root._stamp, root._note, root._leftArt, root._rightArt, root._grid,
          root._leftStat, root._h, root._axis, root._src, root._mid
        ];
        if (root._left) els.push(root._left.g);
        if (root._right) els.push(root._right.g);
        if (root._cards) els = els.concat(root._cards);
        if (root._extras) els = els.concat(root._extras);
        if (root._leftBits) els.push(root._leftBits.title, root._leftBits.tag);
        if (root._rightBits) els.push(root._rightBits.title, root._rightBits.tag);
        if (root._items) els = els.concat(root._items);
        if (root._block) els = els.concat(root._block);
        els.forEach(boxOf);
      });
      if (bars) {
        [bars.root._left, bars.root._right].forEach(function (col) {
          col.bar.setAttribute("y", String(bars.root._base));
          col.bar.setAttribute("height", "0");
        });
      }
      measureAll.done = true;
    }
    function activeScene(t) {
      var scenes = film.scenes;
      var found = scenes[scenes.length - 1];
      for (var i = 0; i < scenes.length; i++) {
        if (t >= scenes[i].start && t < scenes[i].end) return scenes[i];
      }
      return found;
    }
    function transitionOf(t) {
      var scenes = film.scenes;
      for (var i = 0; i < scenes.length - 1; i++) {
        var boundary = scenes[i].end;
        var a = boundary - MORPH_OUT;
        var b = boundary + MORPH_IN;
        if (t >= a && t < b) {
          return { index: i, p: easeIO((t - a) / (b - a)), out: scenes[i], inn: scenes[i + 1] };
        }
      }
      return null;
    }
    function runScene(scene, t) {
      var span = Math.max(0.001, scene.end - scene.start);
      var local = t - scene.start;
      if (local < 0) local = 0;
      if (local > span) local = span;
      updaters[scene.template](scene.root, local, span, scene);
    }
    function subtitleOpacity(t) {
      var o = 1;
      for (var i = 0; i < film.scenes.length - 1; i++) {
        var d = t - film.scenes[i].end;
        if (d >= -0.12 && d < 0) o = Math.min(o, -d / 0.12);
        else if (d >= 0 && d < 0.14) o = Math.min(o, d / 0.14);
      }
      return o;
    }
    function showPair(tr) {
      tr.out.root.style.opacity = "1";
      tr.inn.root.style.opacity = "1";
      tr.out.root.style.zIndex = "1";
      tr.inn.root.style.zIndex = "2";
    }
    function morphSplit(tr) {
      var p = tr.p;
      var o = tr.out.root;
      var n = tr.inn.root;
      var racks = boxOf(o._rackCluster);
      var station = boxOf(o._station);
      var leftCard = n._cards[0];
      var rightCard = n._cards[1];
      morphTo(o._rackCluster, racks, boxOf(leftCard), p, 1 - ramp(p, 0.22, 0.58));
      morphTo(o._station, station, boxOf(rightCard), p, 1 - ramp(p, 0.05, 0.36));
      morphTo(leftCard, racks, boxOf(leftCard), p, ramp(p, 0.16, 0.52));
      morphTo(rightCard, station, boxOf(rightCard), p, ramp(p, 0.16, 0.52));
      fadeStyle(o._title, 1 - ramp(p, 0, 0.36));
      o._title.style.transform = "translateY(" + (-p * 36).toFixed(2) + "px)";
      grip(o._title);
      fadeStyle(o._deck, 1 - ramp(p, 0, 0.3));
      fadeStyle(o._power, 1 - ramp(p, 0, 0.28));
      (o._extras || []).forEach(function (el) { fadeStyle(el, 1 - ramp(p, 0, 0.34)); });
    }
    function morphBars(tr) {
      var p = tr.p;
      var o = tr.out.root;
      var n = tr.inn.root;
      var leftCard = o._cards[0];
      var rightCard = o._cards[1];
      var leftCol = boxOf(n._left.g);
      var rightCol = boxOf(n._right.g);
      var textOut = 1 - ramp(p, 0.05, 0.28);
      morphTo(leftCard, boxOf(leftCard), leftCol, p, 1 - ramp(p, 0.48, 0.78));
      morphTo(rightCard, boxOf(rightCard), rightCol, p, 1 - ramp(p, 0.42, 0.7));
      fadeChildren(leftCard, textOut);
      fadeChildren(rightCard, textOut);
      morphTo(n._left.g, boxOf(leftCard), leftCol, p, ramp(p, 0.34, 0.72));
      var tint = mixHex(BLUE, ORANGE, ramp(p, 0.05, 0.5));
      rightCard.style.borderTopColor = tint;
      grip(rightCard);
      var badge = rightCard.querySelector(".badge");
      if (badge) {
        badge.style.backgroundColor = tint;
        badge.style.borderColor = tint;
        grip(badge);
      }
      fadeStyle(o._stamp, 1 - ramp(p, 0, 0.3));
      fadeStyle(o._note, 1 - ramp(p, 0, 0.3));
      fadeStyle(n._title, ramp(p, 0.38, 0.8));
      fadeStyle(n._axis, ramp(p, 0.62, 0.9));
      fadeStyle(n._src, ramp(p, 0.42, 0.82));
    }
    function zoomThrough(tr) {
      var p = tr.p;
      var out = tr.out.root;
      var inn = tr.inn.root;
      paintPlate(out);
      paintPlate(inn);
      out.style.transformOrigin = "center center";
      out.style.transform = "scale(" + lerp(1, 1.34, p).toFixed(4) + ")";
      out.style.opacity = String(1 - ramp(p, 0.3, 0.52));
      inn.style.transformOrigin = "center center";
      inn.style.transform = "scale(" + lerp(1.22, 1, p).toFixed(4) + ")";
      inn.style.opacity = String(ramp(p, 0.36, 0.62));
      grip(out);
      grip(inn);
    }
    function morphGrid(tr) {
      var p = tr.p;
      var o = tr.out.root;
      var n = tr.inn.root;
      var from = boxOf(o._leftArt);
      var to = boxOf(n._grid);
      morphTo(o._leftArt, from, to, p, 1 - ramp(p, 0.18, 0.64));
      morphTo(n._grid, from, to, p, ramp(p, 0.26, 0.7));
      [o._rightArt, o._rightBits.title, o._rightBits.tag].forEach(function (el) {
        el.style.transform = "translateX(" + (p * 210).toFixed(2) + "px)";
        el.style.opacity = String(1 - ramp(p, 0.04, 0.52));
        grip(el);
      });
      fadeStyle(o._leftBits.title, 1 - ramp(p, 0.04, 0.4));
      fadeStyle(o._leftBits.tag, 1 - ramp(p, 0, 0.34));
      fadeStyle(o._mid, 1 - ramp(p, 0, 0.26));
      fadeStyle(n._leftStat, ramp(p, 0.38, 0.78));
    }
    function slideUp(tr) {
      var p = tr.p;
      var out = tr.out.root;
      var inn = tr.inn.root;
      paintPlate(out);
      paintPlate(inn);
      out.style.transform = "translateY(" + (-p * 100).toFixed(3) + "%)";
      out.style.opacity = "1";
      inn.style.transform = "translateY(" + ((1 - p) * 100).toFixed(3) + "%)";
      inn.style.opacity = "1";
      grip(out);
      grip(inn);
    }
    function shapeWipe(tr) {
      var p = tr.p;
      var out = tr.out.root;
      var inn = tr.inn.root;
      paintPlate(out);
      paintPlate(inn);
      out.style.clipPath = "inset(0 0 0 " + (p * 100).toFixed(3) + "%)";
      inn.style.clipPath = "inset(0 " + ((1 - p) * 100).toFixed(3) + "% 0 0)";
      var fx = document.getElementById("fx");
      fx.style.opacity = "1";
      fx.style.transform = "translateX(" + (p * stage.clientWidth - 9).toFixed(2) + "px)";
      grip(out);
      grip(inn);
    }
    var joins = [morphSplit, morphBars, zoomThrough, morphGrid, slideUp, shapeWipe];

    window.setRenderTime = function (t) {
      release();
      var fx = document.getElementById("fx");
      fx.style.opacity = "0";
      fx.style.transform = "";
      film.scenes.forEach(function (scene) {
        scene.root._present = false;
        scene.root.style.opacity = "0";
        scene.root.style.transform = "";
        scene.root.style.clipPath = "";
        scene.root.style.zIndex = "";
        scene.root.style.transformOrigin = "";
      });
      measureAll();
      var tr = transitionOf(t);
      if (tr) tr.inn.root._present = true;
      var current = activeScene(t);
      var idx = film.scenes.indexOf(current);
      film.scenes.forEach(function (scene, i) {
        var span = Math.max(0.001, scene.end - scene.start);
        var local = t - scene.start;
        var progress = i < idx ? 1 : (i === idx ? clamp01(local / span) : 0);
        scene._tick.style.transform = "scaleX(" + progress + ")";
        scene._tick.style.background = i < idx ? BLUE : ORANGE;
      });
      if (tr) {
        runScene(tr.out, t);
        runScene(tr.inn, t);
        showPair(tr);
        joins[tr.index](tr);
      } else {
        current.root.style.opacity = "1";
        runScene(current, t);
      }
      var text = cueText(current.cues, Math.max(0, t - current.start));
      var sub = document.getElementById("sub");
      sub.textContent = text;
      var so = subtitleOpacity(t);
      sub.style.opacity = String(so);
      document.getElementById("submark").style.opacity = text ? String(so) : "0";
    };
  </script>
</body>
</html>
