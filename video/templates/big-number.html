<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="tokens.css">
  <style>
    main {
      position: absolute;
      inset: 0;
      padding: 200px 88px 280px 112px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .kicker {
      margin: 0 0 24px;
      font-size: 30px;
      letter-spacing: 0.2em;
      color: rgba(247, 244, 236, 0.78);
    }
    .label {
      margin: 0 0 28px;
      font-size: 48px;
      line-height: 1.35;
      font-weight: 700;
    }
    .figure {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: wrap;
    }
    .number {
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -1px;
      color: var(--paper);
    }
    .number.xl { font-size: 248px; }
    .number.lg { font-size: 188px; }
    .number.md { font-size: 132px; }
    .unit {
      margin-bottom: 22px;
      font-size: 48px;
      line-height: 1.2;
      color: var(--orange);
    }
    .aside {
      margin: 36px 0 0;
      padding-top: 24px;
      border-top: 2px solid rgba(31, 110, 140, 0.85);
      font-size: 40px;
      line-height: 1.4;
      color: rgba(247, 244, 236, 0.88);
    }
    .aside:empty { display: none; }
    .source {
      margin: 28px 0 0;
      font-size: 28px;
      letter-spacing: 0.04em;
      color: rgba(247, 244, 236, 0.62);
    }
  </style>
</head>
<body>
  <div class="rail"></div>
  <div class="grain"></div>
  <main>
    <p class="kicker" data-rise>关键数据</p>
    <p class="label" data-rise>__LABEL__</p>
    <div class="figure" data-rise>
      <span class="number __SIZE__" __COUNT_ATTRS__>__VALUE__</span>
      <span class="unit">__UNIT__</span>
    </div>
    <p class="aside">__ASIDE__</p>
    <p class="source">__SOURCE_LINE__</p>
  </main>
  <p id="sub" class="subtitle"></p>
  <script>
    window.__cues = __CUES__;
    window.__duration = __DURATION__;
    function applyCue(t) {
      var cues = window.__cues || [];
      var text = "";
      for (var i = 0; i < cues.length; i++) {
        if (t >= cues[i].start && t < cues[i].end) {
          text = cues[i].text;
          break;
        }
      }
      var node = document.getElementById("sub");
      node.textContent = text;
      node.style.display = text ? "block" : "none";
    }
    window.setRenderTime = function (t) {
      applyCue(t);
      var dur = window.__duration || 5;
      var intro = Math.max(0, Math.min(1, t / 0.45));
      var nodes = document.querySelectorAll("[data-rise]");
      for (var i = 0; i < nodes.length; i++) {
        nodes[i].style.opacity = String(intro);
        nodes[i].style.transform = "translateY(" + ((1 - intro) * 28) + "px)";
      }
      var num = document.querySelector("[data-count]");
      if (!num) return;
      var target = parseFloat(num.getAttribute("data-count"));
      var decimals = parseInt(num.getAttribute("data-decimals") || "0", 10);
      var done = Math.min(1, t / Math.min(1.3, dur * 0.45));
      var eased = 1 - Math.pow(1 - done, 3);
      num.textContent = (target * eased).toFixed(decimals);
    };
  </script>
</body>
</html>
