<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="tokens.css">
  <style>
    .frame {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--navy);
    }
    #still {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    .shade {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 720px;
      background: linear-gradient(to top, rgba(27, 42, 65, 0.88), rgba(27, 42, 65, 0));
      z-index: 2;
    }
    .chyron {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 300px;
      z-index: 5;
      background: var(--paper);
      color: var(--navy);
      padding: 32px 36px 28px;
    }
    .chyron .mark {
      width: 56px;
      height: 6px;
      background: var(--orange);
      margin-bottom: 16px;
    }
    .chyron p {
      margin: 0;
      font-size: 42px;
      line-height: 1.4;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img id="still" src="__IMAGE__" alt="">
  </div>
  <div class="shade"></div>
  <div class="rail"></div>
  <div class="chyron" id="chyron">
    <div class="mark"></div>
    <p>__CAPTION__</p>
  </div>
  <p id="sub" class="subtitle"></p>
  <script>
    window.__cues = __CUES__;
    window.__duration = __DURATION__;
    window.__pan = __PAN__;
    function applyCue(t) {
      var cues = window.__cues || [];
      var text = "";
      for (var i = 0; i < cues.length; i++) {
        if (t >= cues[i].start && t < cues[i].end) {
          text = cues[i].text;
          break;
        }
      }
      var node = document.getElementById("sub");
      node.textContent = text;
      node.style.display = text ? "block" : "none";
    }
    window.setRenderTime = function (t) {
      applyCue(t);
      var dur = window.__duration || 5;
      var p = Math.max(0, Math.min(1, t / dur));
      var img = document.getElementById("still");
      var pan = window.__pan || 1;
      var x = pan * (-4 + 8 * p);
      var y = -1.5 + 3 * p;
      var scale = 1.12 + 0.08 * p;
      img.style.transform = "scale(" + scale + ") translate(" + x + "%, " + y + "%)";
      var intro = Math.max(0, Math.min(1, (t - 0.12) / 0.4));
      document.getElementById("chyron").style.opacity = String(intro);
    };
  </script>
</body>
</html>
